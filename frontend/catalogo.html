<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pobre Play — Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="catalogo.css" />
</head>
<body class="app-body">
  <header class="app-header">
    <div>
      <span class="eyebrow">Pobre Play</span>
      <h1>Filmes disponíveis</h1>
    </div>
    <button class="btn-secondary" id="btn-logout">Sair</button>
  </header>

  <main class="catalogo-container">
    <section class="hero-play">
      <div>
        <span class="badge">Catálogo</span>
        <h2>Escolha um filme para ver os detalhes</h2>
        <p>Clique em um card para abrir as informações ou use a estrela para salvar o filme.</p>
      </div>
    </section>

    <section class="catalog-toolbar" aria-label="Opções do catálogo">
      <div>
        <span class="eyebrow">Sua biblioteca</span>
        <h2 id="catalog-title">Todos os filmes</h2>
        <p id="catalog-description">Explore todos os filmes cadastrados.</p>
      </div>

      <div class="view-switch" role="tablist" aria-label="Visualização dos filmes">
        <button class="view-button active" type="button" data-view="todos" role="tab" aria-selected="true">
          Todos <span id="count-todos">0</span>
        </button>
        <button class="view-button" type="button" data-view="favoritos" role="tab" aria-selected="false">
          ★ Favoritos <span id="count-favoritos">0</span>
        </button>
      </div>
    </section>

    <p class="catalog-status" id="catalog-status" role="status" aria-live="polite"></p>
    <section class="movie-grid" id="movie-grid" aria-live="polite"></section>
  </main>

  <dialog class="movie-modal" id="movie-modal" aria-labelledby="modal-title">
    <button class="modal-close" id="modal-close" type="button" aria-label="Fechar detalhes">×</button>
    <img id="modal-img" alt="Capa do filme" />
    <div class="modal-content">
      <div class="modal-heading">
        <div>
          <h2 id="modal-title"></h2>
          <p class="movie-meta" id="modal-meta"></p>
        </div>
        <button class="modal-favorite" id="modal-favorite" type="button" aria-pressed="false">
          <span class="favorite-symbol" aria-hidden="true">☆</span>
          <span id="modal-favorite-text">Adicionar aos favoritos</span>
        </button>
      </div>
      <p class="modal-synopsis" id="modal-sinopse"></p>
    </div>
  </dialog>

  <div class="catalog-toast" id="catalog-toast" role="status" aria-live="polite"></div>

  <script type="module" src="catalogo.js"></script>
</body>
</html>
